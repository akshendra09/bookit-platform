server:
  port: 8082

spring:
  application:
    name: catalog-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:postgresql://postgres:5432/catalogdb
    username: bookit
    password: bookit
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: redis
      port: 6379
  cache:
    type: redis

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
